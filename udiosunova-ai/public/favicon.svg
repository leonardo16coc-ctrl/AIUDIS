<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="1"/>
      <stop offset="30%" stop-color="#2563EB" stop-opacity="1"/>
      <stop offset="70%" stop-color="#1D4ED8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="centerLabelGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Outer vinyl dark frame -->
  <circle cx="256" cy="256" r="240" fill="#020617" stroke="#1E293B" stroke-width="4"/>
  <!-- Vinyl grooves -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.8"/>
  <!-- Glowing Neon Core (Blue Vinyl styling from the mockup) -->
  <circle cx="256" cy="256" r="115" fill="url(#vinylGrad)" filter="url(#glow)"/>
  <!-- Core vinyl label dark ring -->
  <circle cx="256" cy="256" r="65" fill="url(#centerLabelGrad)" stroke="#60A5FA" stroke-width="2"/>
  <!-- Outer label details -->
  <circle cx="256" cy="256" r="45" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Center spindle hole -->
  <circle cx="256" cy="256" r="18" fill="#60A5FA"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
</svg>
